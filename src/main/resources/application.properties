spring.application.name=Erp
server.port=8081
server.address=0.0.0.0

spring.datasource.url=jdbc:postgresql://localhost:15432/qa
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=dev
#spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=validate

# Flyway: V1 = esquema base (db/nueva_bd/01_esquema.sql, aplicado con migrar.ps1).
# En el primer arranque marca la base como V1 y aplica V2, V3... si existen.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.schemas=${spring.jpa.properties.hibernate.default_schema}
spring.flyway.default-schema=${spring.jpa.properties.hibernate.default_schema}
spring.flyway.create-schemas=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-7y2aghw84icxg0pg.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://dev-7y2aghw84icxg0pg.us.auth0.com/.well-known/jwks.json

#logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
#logging.level.org.springframework.security.oauth2=DEBUG

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

