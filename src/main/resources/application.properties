# Flyway: V1 = esquema base (db/nueva_bd/01_esquema.sql, aplicado con migrar.ps1).
# En el primer arranque marca la base como V1 y aplica V2, V3... si existen.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.schemas=${spring.jpa.properties.hibernate.default_schema}
spring.flyway.default-schema=${spring.jpa.properties.hibernate.default_schema}
spring.flyway.create-schemas=false
# Las consultas nativas (sin esquema escrito) usan el mismo esquema que Hibernate
spring.datasource.hikari.connection-init-sql=SET search_path TO ${spring.jpa.properties.hibernate.default_schema}

