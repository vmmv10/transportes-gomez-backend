# ---------------------------------------------------------------------
# Correo (SMTP). Todo por variables de entorno; sin MAIL_HOST no se envían
# correos y el resto del sistema funciona igual. La clave nunca va aquí.
#   MAIL_HOST / MAIL_PORT      servidor SMTP (ej. smtp.gmail.com / 587)
#   MAIL_USERNAME / MAIL_PASSWORD  cuenta y clave (en Gmail, "contraseña de aplicación")
#   MAIL_FROM                  remitente (por defecto la misma cuenta)
#   MAIL_AVISOS                quienes reciben los avisos de cotizaciones y mensajes, separados por coma
#   MAIL_SSL=true + MAIL_STARTTLS=false para servidores en el puerto 465
# ---------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
app.correo.remitente=${MAIL_FROM:${MAIL_USERNAME:}}
app.correo.remitente-nombre=${MAIL_FROM_NAME:Transportes G\u00f3mez Vel\u00e1squez}
app.correo.avisos=${MAIL_AVISOS:}
app.correo.acuse-solicitante=${MAIL_ACUSE:true}
app.correo.telefono=${MAIL_TELEFONO:}
# Enlace "Abrir en el ERP" de los avisos
app.correo.erp-url=${ERP_URL:http://localhost:4200}
